name: Release (Windows)

# Nur auf Knopfdruck: GitHub → Actions → „Release (Windows)“ → „Run workflow“.
# Pushes und Tags lösen kein Release aus.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Versionssprung (patch = Fehlerbehebung, minor = neue Funktionen, major = großer Umbau)'
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write       # Tag + Release anlegen
  pull-requests: write  # Release-PR erstellen und mergen (main ist geschützt)
  id-token: write       # Herkunftsnachweis signieren
  attestations: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Version erhöhen und Changelog übernehmen
        id: version
        run: |
          npm version ${{ inputs.bump }} --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          node scripts/changelog.mjs "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Erst bauen – schlägt das fehl, wird nichts committet oder veröffentlicht
      - name: App bauen
        run: |
          npm run build
          npx electron-builder --win --publish never

      # main ist geschützt (nur per Pull Request). Deshalb landet der Versions-Commit
      # über einen eigenen Release-PR in main, der sofort gemergt wird.
      - name: Version committen, taggen und per PR nach main bringen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=${{ steps.version.outputs.version }}
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "release/v$V"
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "v$V"
          git tag "v$V"
          git push origin "release/v$V" "v$V"
          gh pr create --base main --head "release/v$V" --title "v$V" --body-file release-notes.md
          # Merge-Commit (kein Squash), damit der getaggte Commit Teil von main wird
          gh pr merge "release/v$V" --merge --delete-branch

      - name: Herkunftsnachweis für den Installer
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/K-Love-Setup-${{ steps.version.outputs.version }}.exe

      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=${{ steps.version.outputs.version }}
          gh release create "v$V" --title "K-Love $V" --notes-file release-notes.md \
            "release/K-Love-Setup-$V.exe" "release/K-Love-Setup-$V.exe.blockmap" release/latest.yml

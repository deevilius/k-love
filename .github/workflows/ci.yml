name: Prüfen

# Bei jedem Pull Request und jedem Push auf main: Typen prüfen, Tests laufen lassen, App bauen.
# Der Windows-Installer entsteht weiterhin nur im Release-Workflow.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Electron selbst wird zum Prüfen nicht gebraucht
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typen prüfen
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: App bauen
        run: npx vite build
      - name: Electron-Skripte prüfen
        run: for f in electron/*.cjs; do node --check "$f"; done
